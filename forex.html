<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="主要貨幣對新台幣匯率與換算">
  <title>外匯｜台股投資分析平台</title>
  <link rel="stylesheet" href="./page.css"><link rel="stylesheet" href="./widget.css"><link rel="stylesheet" href="./platform.css"><link rel="stylesheet" href="./sidebar.css"><link rel="stylesheet" href="./forex.css">
</head>
<body class="has-sidebar">
  <header class="layout-header"><a class="layout-brand" href="./index.html">台股投資分析平台</a><div class="layout-header-actions"><label for="themeToggleSwitch" class="layout-theme-label">深色模式</label><label class="layout-theme-switch" for="themeToggleSwitch"><input id="themeToggleSwitch" type="checkbox" role="switch" aria-label="切換深色模式"><span></span></label></div></header>
  <button class="sidebar-toggle" type="button" aria-label="開啟導覽列" aria-controls="platformSidebar"><span></span><span></span><span></span></button><div class="sidebar-backdrop" data-sidebar-close></div><aside id="platformSidebar" class="sidebar"><nav class="sidebar-nav"></nav></aside>
  <main class="layout-main" data-page="forex"><div class="page-container">
    <header class="page-header"><p class="page-eyebrow">FOREX</p><h1 class="page-title">外匯</h1><p class="page-description">主要貨幣對 TWD 匯率（參考）</p></header>
    <div class="page-body forex-page">
      <section class="widget forex-controls">
        <label for="currencySearch">搜尋貨幣</label>
        <input id="currencySearch" type="search" placeholder="輸入代碼或名稱，例如 USD、美元" autocomplete="off">
        <p id="forexState" role="status">載入中</p>
      </section>
      <section class="page-section">
        <h2>主要貨幣匯率</h2>
        <p class="forex-unit">每 1 單位外幣可兌換的新台幣參考值</p>
        <div class="forex-table-wrap"><table id="forexTable"><thead><tr><th data-sort="currency">貨幣代碼</th><th data-sort="name">名稱</th><th data-sort="twd_rate">TWD 匯率</th><th data-sort="source_date">資料日期</th></tr></thead><tbody></tbody></table></div>
      </section>
      <section class="page-section">
        <h2>匯率換算器</h2>
        <div class="widget forex-converter">
          <label class="forex-converter-field" for="exchangeAmount">金額<input id="exchangeAmount" type="number" min="0" step="any" inputmode="decimal" value="1"></label>
          <label class="forex-converter-field" for="fromCurrency">來源貨幣<select id="fromCurrency"></select></label>
          <span class="forex-converter-arrow" aria-hidden="true">→</span>
          <label class="forex-converter-field" for="toCurrency">目標貨幣<select id="toCurrency"></select></label>
          <output id="exchangeResult" for="exchangeAmount fromCurrency toCurrency">—</output>
        </div>
      </section>
      <footer class="forex-source">
        <p>資料日期：<time id="sourceDate">—</time></p>
        <p>最後更新：<time id="fetchedAt">—</time></p>
        <p>資料來源：<a href="https://cpx.cbc.gov.tw/" target="_blank" rel="noopener noreferrer">中央銀行統計資料庫</a></p>
        <p>註：匯率由中央銀行公布的主要貨幣對美元匯率交叉換算，僅供參考，不代表銀行實際交易牌價。</p>
      </footer>
    </div>
  </div></main>
  <script src="./sidebar.js"></script><script src="./product-integration.js"></script><script src="./forex.js"></script>
</body>
</html>
