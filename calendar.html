<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台股事件簿</title>
  <link rel="stylesheet" href="./page.css" />
  <link rel="stylesheet" href="./widget.css" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./sidebar.css" />
</head>
<body class="has-sidebar">
  <header class="layout-header">
    <a class="layout-brand" href="./index.html" aria-label="台股投資分析平台首頁">
      <span class="layout-logo" aria-hidden="true">
        <svg viewBox="0 0 36 36"><path d="M7 26V17m7 9V10m7 16V14m7 12V7M6 13l8-6 7 3 9-6" /></svg>
      </span>
      <span>台股投資分析平台</span>
    </a>
    <div class="layout-header-actions">
      <label for="themeToggleSwitch" class="layout-theme-label">深色模式</label>
      <label class="layout-theme-switch" for="themeToggleSwitch">
        <input id="themeToggleSwitch" type="checkbox" role="switch" aria-label="深色模式">
        <span></span>
      </label>
    </div>
  </header>
  <button class="sidebar-toggle" type="button" aria-label="開啟導覽列" aria-controls="platformSidebar" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <div class="sidebar-backdrop" data-sidebar-close></div>
  <aside id="platformSidebar" class="sidebar" aria-label="平台導覽">
    <div class="sidebar-brand">
      <span class="sidebar-brand-icon" aria-hidden="true">台</span>
      <div>
        <strong>台股投資</strong>
        <span>分析平台</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a class="sidebar-item" href="./index.html">
        <span class="sidebar-item-icon" aria-hidden="true">⌂</span>
        <span>首頁</span>
      </a>
      <a class="sidebar-item is-active" href="./calendar.html" aria-current="page">
        <span class="sidebar-item-icon" aria-hidden="true">▦</span>
        <span>台股事件簿</span>
      </a>
      <a class="sidebar-item" href="./prediction.html">
        <span class="sidebar-item-icon" aria-hidden="true">⌁</span>
        <span>隔日行情分析</span>
      </a>
      <a class="sidebar-item" href="./market-overview.html">
        <span class="sidebar-item-icon" aria-hidden="true">◎</span>
        <span>市場總覽</span>
      </a>
      <div class="sidebar-item is-disabled" aria-disabled="true">
        <span class="sidebar-item-icon" aria-hidden="true">≋</span>
        <span>籌碼分析</span>
        <small>規劃中</small>
      </div>
    </nav>
  </aside>
  <main class="layout-main" data-page="calendar">
   <div class="page-container">
    <header class="page-header">
      <p class="page-eyebrow">MARKET EVENTS</p>
      <h1 class="page-title">台股事件簿</h1>
      <p class="page-description">除權息、股東會、法說會等台股事件月曆</p>
    </header>

    <div class="page-body">
     <section class="page-section" aria-label="台股事件月曆">
     <div class="app">
    <header class="topbar">
      <div class="toolbar">
        <select id="stockSelect" class="stock-select" aria-label="選擇股票">
          <option value="__ALL__">全部股票</option>
        </select>
        <button id="todayBtn" class="btn btn-light">Today</button>
        <button id="prevBtn" class="btn btn-light">‹</button>
        <button id="nextBtn" class="btn btn-light">›</button>
      </div>

      <div class="month-title-wrap">
        <h2 id="monthTitle" class="month-title"></h2>
      </div>
    </header>

    <section class="legend">
      <span class="legend-item">
        <span class="dot dot-dividend"></span> 除權息
      </span>
      <span class="legend-item">
        <span class="dot dot-earnings-call"></span> 法說會
      </span>
      <span class="legend-item">
        <span class="dot dot-shareholder-meeting"></span> 股東會
      </span>
      <span class="legend-item">
        <span class="dot dot-dividend-payment"></span> 股利發放日
      </span>
      <span class="legend-item">
        <span class="dot dot-delisting"></span> 終止掛牌
      </span>
    </section>

    <div class="page-card calendar-card">
      <div class="weekdays">
        <div>Sun</div>
        <div>Mon</div>
        <div>Tue</div>
        <div>Wed</div>
        <div>Thu</div>
        <div>Fri</div>
        <div>Sat</div>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
    </div>

    <section class="footer-info">
      <div id="updateInfo">載入中...</div>
      <div>資料來源：Yahoo（TWSE API、MOPS 暫停）</div>
    </section>
  </div>
     </section>

  <div id="eventModal" class="modal hidden">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-panel">
      <button id="closeModalBtn" class="modal-close" aria-label="關閉">×</button>
      <div class="modal-header">
        <h3 id="modalTitle">事件詳情</h3>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>
    </div>
   </div>
  </main>

  <script src="./app.js"></script>
  <script src="./sidebar.js"></script>
</body>
</html>
