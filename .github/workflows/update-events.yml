name: Update Taiwan Stock Events

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch latest events
        run: |
          python scripts/fetch_events.py

      - name: Update market data
        run: |
          python scripts/update_market_data.py

      - name: Update market signals
        run: |
          python scripts/update_market_signals.py

      - name: Update daily history
        run: |
          python scripts/update_history.py

      - name: Build prediction dataset
        run: |
          python scripts/build_prediction_dataset.py

      - name: Train baseline model
        run: |
          python scripts/train_model.py

      - name: Generate market prediction when model exists
        run: |
          if [ -f models/baseline_model.pkl ]; then
            python scripts/predict_market.py
          else
            echo "Baseline model is not available; prediction is skipped"
          fi

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/event.json data/market/*.json data/history/*.csv
          for file in models/model_info.json models/baseline_model.pkl data/prediction/prediction.json; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done
          git diff --cached --quiet || git commit -m "chore: update platform data"
          git push
