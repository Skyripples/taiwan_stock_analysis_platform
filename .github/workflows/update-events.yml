name: Update Taiwan Stock Events

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch latest events
        run: |
          python scripts/fetch_events.py

      - name: Update market data
        id: market_data
        continue-on-error: true
        run: |
          python scripts/update_market_data.py

      - name: Update chips history and analysis
        run: |
          python scripts/backfill_chips_history.py
          python scripts/analyze_chips.py

      - name: Update stock analysis caches
        run: |
          python scripts/build_all_stocks.py --daily
          if [ "$(date -u +%d)" = "01" ]; then
            python scripts/build_all_stocks.py --monthly
            python scripts/backfill_stock_valuation.py
          fi
          case "$(date -u +%m-%d)" in
            02-15|05-15|08-15|11-15)
              python scripts/build_all_stocks.py --quarterly
              python scripts/update_stock_financials.py
              python scripts/analyze_stock_data.py
              python scripts/build_peer_analysis.py
              ;;
          esac

      - name: Update market signals
        id: market_signals
        if: always() && steps.market_data.outcome == 'success'
        run: |
          python scripts/update_market_signals.py

      - name: Update daily history
        id: market_history
        if: always() && steps.market_data.outcome == 'success' && steps.market_signals.outcome == 'success'
        run: |
          python scripts/update_history.py

      - name: Build prediction dataset
        id: prediction_dataset
        if: always() && steps.market_history.outcome == 'success'
        run: |
          python scripts/build_prediction_dataset.py

      - name: Validate previous market predictions
        if: always() && steps.prediction_dataset.outcome == 'success'
        run: |
          python scripts/update_prediction_history.py

      - name: Train baseline model
        id: train_model
        if: always() && steps.prediction_dataset.outcome == 'success'
        run: |
          python scripts/train_model.py

      - name: Check production prediction inputs
        id: prediction_readiness
        if: always()
        env:
          MARKET_DATA_OUTCOME: ${{ steps.market_data.outcome }}
        run: |
          python scripts/check_prediction_readiness.py

      - name: Generate Baseline Beta prediction when model exists
        id: market_prediction
        if: steps.prediction_readiness.outputs.ready == 'true'
        run: |
          if [ -f models/baseline_model.pkl ]; then
            python scripts/predict_market.py
          else
            echo "Baseline model is not available; prediction is skipped"
          fi

      - name: Record latest market prediction
        if: always() && steps.market_prediction.outcome == 'success'
        run: |
          python scripts/update_prediction_history.py

      - name: Configure Linode SSH
        id: linode_ssh
        continue-on-error: true
        env:
          LINODE_HOST: ${{ secrets.LINODE_HOST }}
          LINODE_SSH_PRIVATE_KEY: ${{ secrets.LINODE_SSH_PRIVATE_KEY }}
          LINODE_SSH_HOST_KEY: ${{ secrets.LINODE_SSH_HOST_KEY }}
        run: |
          if [ -z "$LINODE_HOST" ] || [ -z "$LINODE_SSH_PRIVATE_KEY" ] || [ -z "$LINODE_SSH_HOST_KEY" ]; then
            echo "Linode SSH secrets are not configured; database sync cannot run"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$LINODE_SSH_PRIVATE_KEY" > ~/.ssh/linode_stock_sync
          chmod 600 ~/.ssh/linode_stock_sync
          printf '%s\n' "$LINODE_SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync full-market data to Linode PostgreSQL
        id: db_sync
        if: always() && steps.linode_ssh.outcome == 'success'
        continue-on-error: true
        env:
          LINODE_HOST: ${{ secrets.LINODE_HOST }}
        run: |
          rsync -az --relative \
            -e "ssh -i ~/.ssh/linode_stock_sync -o BatchMode=yes" \
            data/stocks/ scripts/sync_stock_database.py scripts/database/ deploy/sync-stock-database.sh \
            "stock-sync@$LINODE_HOST:/opt/taiwan_stock_analysis_platform/"
          ssh -i ~/.ssh/linode_stock_sync -o BatchMode=yes "stock-sync@$LINODE_HOST" \
            "bash /opt/taiwan_stock_analysis_platform/deploy/sync-stock-database.sh daily"
          if [ "$(date -u +%d)" = "01" ]; then
            ssh -i ~/.ssh/linode_stock_sync -o BatchMode=yes "stock-sync@$LINODE_HOST" \
              "bash /opt/taiwan_stock_analysis_platform/deploy/sync-stock-database.sh monthly"
          fi
          case "$(date -u +%m-%d)" in
            02-15|05-15|08-15|11-15)
              ssh -i ~/.ssh/linode_stock_sync -o BatchMode=yes "stock-sync@$LINODE_HOST" \
                "bash /opt/taiwan_stock_analysis_platform/deploy/sync-stock-database.sh quarterly"
              ;;
          esac

      - name: Update data service manifest
        if: always()
        env:
          SSH_OUTCOME: ${{ steps.linode_ssh.outcome }}
          DB_OUTCOME: ${{ steps.db_sync.outcome }}
        run: |
          if [ "$SSH_OUTCOME" = "success" ] && [ "$DB_OUTCOME" = "success" ]; then
            python scripts/update_data_service_status.py --database-sync-status success
          else
            python scripts/update_data_service_status.py --database-sync-status failed
          fi

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/event.json data/market/*.json data/history/*.csv data/analysis/current/chips_summary.json
          git add data/status/data_service_status.json
          git add data/status/prediction_pipeline_status.json
          git add data/stocks/index.json data/stocks/build_stats.json data/stocks/industry_snapshot.json data/stocks/peer_rankings.json
          for file in models/model_info.json models/baseline_model.pkl models/platt_calibrator.pkl data/prediction/prediction.json; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done
          git diff --cached --quiet || git commit -m "chore: update platform data"
          git push

      - name: Require successful PostgreSQL sync
        if: always() && (steps.linode_ssh.outcome != 'success' || steps.db_sync.outcome != 'success')
        run: |
          echo "Full-market PostgreSQL sync failed; API continues serving the last valid database state"
          exit 1
