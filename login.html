<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="台股投資分析平台帳號登入"><title>登入｜台股投資分析平台</title><link rel="stylesheet" href="./account.css"></head>
<body class="account-page"><header class="account-topbar"><a href="./index.html" class="account-brand">台股投資分析平台</a><a href="./index.html" class="account-back">返回首頁</a></header><main class="account-main"><section class="account-card" aria-labelledby="accountTitle"><div class="account-intro"><p>ACCOUNT</p><h1 id="accountTitle">帳號登入</h1><span>管理者登入需要密碼與本機 Passkey 雙重驗證。</span></div>
<div class="account-panel is-active" data-account-panel="login"><form class="account-form" id="loginForm"><label for="loginAccount">帳號</label><input id="loginAccount" name="account" autocomplete="username" required><label for="loginPassword">密碼</label><input id="loginPassword" name="password" type="password" autocomplete="current-password" required><button type="submit" class="account-submit" id="loginSubmit">登入並驗證 Passkey</button></form><div class="account-links"><button type="button" data-account-view="register">註冊</button><button type="button" data-account-view="forgot">忘記密碼</button></div></div>
<div class="account-panel" data-account-panel="register" hidden><h2>帳號註冊</h2><p class="account-help">目前不開放公開註冊，帳號須由管理者於後端建立。</p><button type="button" class="account-text-button" data-account-view="login">返回登入</button></div>
<div class="account-panel" data-account-panel="forgot" hidden><h2>忘記密碼</h2><p class="account-help">目前不提供電子郵件重設。請由伺服器管理者安全重設密碼，Passkey 不會透過郵件傳送。</p><button type="button" class="account-text-button" data-account-view="login">返回登入</button></div><p id="accountMessage" class="account-message" role="status" aria-live="polite"></p></section></main><script src="./account.js"></script></body></html>
