# Include this exact-match location inside the existing HTTPS server block.
# It exposes only the derived browser JSON, never the DAY state directory.
location = /api/v1/futures/day-shadow.json {
    alias /opt/taiwan-stock-day-experiment/readonly-api/day-shadow.json;
    default_type application/json;
    limit_except GET { deny all; }

    add_header Access-Control-Allow-Origin "https://skyripples.github.io" always;
    add_header Vary "Origin" always;
    add_header Cache-Control "public, max-age=60" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
}
